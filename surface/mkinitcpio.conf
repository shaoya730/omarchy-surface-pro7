# The stock linux-omarchy kernel does not provide ipts or hid_surface.
# Keep the previous adapted 7.2.5-6 kernel working as a boot fallback.
if [[ $KERNELVERSION == *-surface || $KERNELVERSION == 7.2.5-6-omarchy ]]; then
  MODULES+=(pinctrl_icelake surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_hid_core surface_hid surface_kbd hid_surface ipts intel_lpss_pci 8250_dw)
fi
